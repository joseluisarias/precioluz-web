name: PVPC diario

on:
  schedule:
    # REE publica mañana hacia las 20:15-20:30 (hora de Madrid). Cinco intentos
    # entre las 20:17 y las 21:57 en verano (UTC+2) y en invierno (UTC+1);
    # cada intento es un no-op si el dato ya está guardado.
    - cron: "17,27,37,47,57 18,19 * * *"
    # Relevo de medianoche (00:35 Madrid) y seguridad matinal (05:35 Madrid).
    - cron: "35 22,23 * * *"
    - cron: "35 3,4 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás a descargar (0 = ayer, hoy y mañana)"
        default: "0"
      force:
        description: "Reescribir aunque el dato no cambie"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Descargar PVPC
        run: |
          ARGS="--days ${{ inputs.days || '0' }}"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python3 scripts/fetch.py $ARGS
      - name: Generar el sitio
        run: |
          python3 scripts/build.py
          python3 tools/og.py
      - name: Commit de datos (solo si cambió algo)
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git -c user.name=precioluz-bot -c user.email=precioluz-bot@users.noreply.github.com \
              commit -m "data: $(date -u +'%F %H:%M') UTC"
            git pull --rebase
            git push
          fi
