name: PVPC diario

on:
  schedule:
    # Un solo disparo al día. 18:20 UTC son las 20:20 en Madrid en horario de
    # verano; en invierno caen las 19:20 y es el propio paso el que reintenta
    # cada 5 minutos hasta que REE publica, así que el dato entra igualmente
    # hacia las 20:20 locales.
    - cron: "20 18 * * *"
    # Relevo de medianoche: el sitio tiene que pasar a mostrar el día nuevo.
    # 23:35 UTC son las 00:35 en invierno y la 01:35 en verano.
    - cron: "35 23 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás a descargar (0 = ayer, hoy y mañana)"
        default: "0"
      force:
        description: "Reescribir aunque el dato no cambie"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

env:
  # 18 intentos cada 5 minutos = hasta 90 minutos esperando a REE.
  REINTENTOS: "18"
  ESPERA: "300"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Descargar PVPC
        run: |
          ARGS="--days ${{ inputs.days || '0' }}"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi

          # Solo la tanda de la tarde espera a que REE publique mañana. El relevo
          # de medianoche y los disparos manuales hacen un único intento.
          HORA=$((10#$(TZ=Europe/Madrid date +%H)))
          if [ "$HORA" -ge 19 ] && [ "$HORA" -le 22 ]; then
            ARGS="$ARGS --require-tomorrow"
            INTENTOS="$REINTENTOS"
          else
            INTENTOS=1
          fi
          echo "Son las $(TZ=Europe/Madrid date +%H:%M) en Madrid; hasta $INTENTOS intento(s)."

          for i in $(seq 1 "$INTENTOS"); do
            if python3 scripts/fetch.py $ARGS; then
              echo "Datos al día en el intento $i."
              exit 0
            fi
            if [ "$i" -lt "$INTENTOS" ]; then
              echo "Intento $i/$INTENTOS sin los precios de mañana; reintento en $((ESPERA / 60)) min."
              sleep "$ESPERA"
            fi
          done
          echo "::warning::REE no publicó los precios de mañana en el plazo previsto; lo recogerá el relevo de medianoche."

      - name: Generar el sitio
        run: |
          python3 scripts/build.py
          python3 tools/og.py

      - name: Commit de datos (solo si cambió algo)
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git -c user.name=precioluz-bot -c user.email=precioluz-bot@users.noreply.github.com \
              commit -m "data: $(date -u +'%F %H:%M') UTC"
            git pull --rebase
            git push
          fi
